#
# Serves the compiled owner-dashboard SPA and reverse-proxies /trpc to the
# apiserver container on the internal Docker network. "apiserver" is the
# compose service name; both dev's Vite proxy and this config point at the
# same origin.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # tRPC: batched HTTP calls (POST) and SSE subscriptions (GET, .subscription
    # procedures via httpSubscriptionLink) share this one prefix. proxy_buffering
    # off is required for the SSE responses to stream instead of arriving in one
    # burst when the connection eventually closes; keeping it off for every /trpc
    # request is harmless for the plain request/response calls.
    location /trpc {
        proxy_pass http://apiserver:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Advertiser uploads: the raw file streams to the apiserver, which checks size and content.
    location /uploads {
        client_max_body_size 210m;
        proxy_request_buffering off;
        proxy_pass http://apiserver:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10m;
    }

    # Uploaded files and their renditions (previews in the dashboard).
    location /content {
        proxy_pass http://apiserver:3000;
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass http://apiserver:3000/healthz;
    }

    # SPA fallback: any path that doesn't match a real file serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for hashed static assets (JS/CSS bundles from Vite)
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No caching for index.html so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
