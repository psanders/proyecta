#
# Serves the compiled player SPA and reverse-proxies /device (the frozen
# /device/v1 protocol, HTTP + SSE) and /media (demo rotation assets) to the
# apiserver container, mirroring dev's Vite proxy (see packages/player/vite.config.ts).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /device/v1/events is a long-lived SSE stream (see
    # packages/api/src/device/router.ts). It already sends
    # "X-Accel-Buffering: no", which nginx honors by default, but
    # proxy_buffering is turned off explicitly here for every /device request
    # so the stream is never held back regardless of upstream headers.
    location /device {
        proxy_pass http://apiserver:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Demo rotation media (images/video). express.static on the apiserver
    # answers Range requests; nginx forwards the Range/Accept-Ranges headers
    # through by default, no special config needed. ^~ (here and on /content) keeps the
    # static-asset regex below from claiming .webp/.png files and 404ing them from local disk.
    location ^~ /media {
        proxy_pass http://apiserver:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Advertisers' ad renditions (per-screen rotations), served like /media.
    location ^~ /content {
        proxy_pass http://apiserver:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        proxy_pass http://apiserver:3000/healthz;
    }

    # SPA fallback: any path that doesn't match a real file serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
