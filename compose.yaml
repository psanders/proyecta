services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: proyecta
      POSTGRES_PASSWORD: proyecta
      POSTGRES_DB: proyecta
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proyecta -d proyecta"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
