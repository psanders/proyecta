name: Release

# Versioning from Conventional Commits (release-please). Every push to main updates one
# "chore(release): X.Y.Z" PR with the version bump and CHANGELOG.md; merging it tags vX.Y.Z,
# creates the GitHub release, then publishes the images and deploys them (paused for the
# `production` environment's approval).
#
# Publish and deploy are called here as reusable workflows: a tag created with GITHUB_TOKEN
# doesn't trigger other workflows, so docker-publish.yml would never see it. Pushing a vX.Y.Z tag
# by hand still works through the old path (docker-publish.yml → deploy.yml).
#
# Requires Settings → Actions → General → "Allow GitHub Actions to create and approve pull
# requests" (release-please opens the release PR with GITHUB_TOKEN).

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
      latest: true

  deploy:
    needs: [release-please, publish]
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release-please.outputs.tag }}
    secrets: inherit
