name: Publish Docker Images

# Builds and pushes the apiserver/dashboard/player images to GHCR on every
# vX.Y.Z tag (or manually). Modeled on QCobro's docker-publish.yml, extended
# to three targets. The three targets build and push in parallel via a
# matrix, each on its own runner with its own GHA cache scope so the legs
# don't clobber each other's layer cache.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: latest)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        target: [apiserver, dashboard, player]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout proyecta
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          IMAGE="${{ env.PREFIX }}/proyecta-${{ matrix.target }}"
          ADD_LATEST=true
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            T="${GITHUB_REF#refs/tags/}"
          else
            T="${{ inputs.tag }}"
            ADD_LATEST=false
          fi
          {
            echo "tags<<__TAGS_EOF__"
            echo "${IMAGE}:${T}"
            [ "$ADD_LATEST" = true ] && echo "${IMAGE}:latest"
            echo "__TAGS_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Summary
        run: |
          echo "## Published image: ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
