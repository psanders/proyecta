name: CI

# Lint, typecheck, build and run unit tests on every PR and on pushes to main.
# Modeled on QCobro's test.yml, extended with a unit-test step (QCobro's own
# workflow skips that — only e2e runs there, in a separate workflow). Neither
# integration tests (need Postgres) nor e2e (needs a running stack + Chromium)
# run here; both are documented in CLAUDE.md as separate `npm run` commands.

on:
  push:
    branches: [main]
    paths:
      - "packages/common/**"
      - "packages/api/**"
      - "packages/dashboard/**"
      - "packages/player/**"
      - "shells/**"
      - "scripts/downloads/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Skip release-please's version-bump commits.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    env:
      # Placeholder so prisma.config.ts resolves without a config/proyecta.json —
      # `prisma generate` never connects to a database.
      DATABASE_URL: "postgresql://proyecta:proyecta@localhost:5432/proyecta"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Generates packages/api/src/generated/prisma, which the api package's
      # own build needs and which the dashboard's typecheck also reaches
      # transitively (it imports the AppRouter type from apiserver's source).
      - name: Generate Prisma client
        run: npm run db:generate --workspace=@proyecta/api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Format check
        run: npx prettier --check .

  shells:
    # The native shells live outside npm workspaces: the Go kiosk helper and the Kotlin Android app.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: shells/kiosk/helper/go.mod
          cache-dependency-path: shells/kiosk/helper/go.sum

      - name: Kiosk helper tests
        working-directory: shells/kiosk/helper
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          go test ./...

      - name: Downloads manifest tests
        run: node --test scripts/downloads/manifest.test.mjs

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Android unit tests and lint
        working-directory: shells/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
